services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms
      POSTGRES_DB: vms
    ports:
      - "5433:5432"
    volumes:
      - vms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vms_pgdata:
